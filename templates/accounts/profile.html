{% extends "base.html" %}{% block content %}
<div class="card bg-dark-subtle border-secondary">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center"><h1 class="h3">Profile</h1><div class="rating-panel compact"><small>ELO RATING</small><strong>{{ request.user.rating }}</strong><span>Peak {{ request.user.peak_rating }}</span></div></div>
    {% if request.user.avatar %}<img
      src="{{ request.user.avatar.url }}"
      class="avatar-lg mb-3"
      alt="Avatar"
    />{% endif %}
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}{{ form.as_p }}<button
        class="btn btn-success"
        type="submit"
      >
        Save Profile
      </button>
    </form>
    <div class="d-flex gap-2 mt-3"><a class="btn btn-outline-light" href="{% url 'accounts:public_profile' request.user.pk %}">View public profile</a><a class="btn btn-outline-light" href="{% url 'accounts:game_history' %}">Game history</a></div>
  </div>
</div>
{% endblock %}
