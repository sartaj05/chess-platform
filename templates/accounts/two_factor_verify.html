{% extends "base.html" %}{% block content %}
<div class="auth-card mx-auto">
  <h1 class="h3 mb-3">Two-factor verification</h1>
  <form method="post">
    {% csrf_token %}{{ form.as_p }}<button
      class="btn btn-success w-100"
      type="submit"
    >
      Verify
    </button>
  </form>
</div>
{% endblock %}
