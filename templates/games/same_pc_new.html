{% extends "base.html" %}

{% block title %}Same PC Game{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-secondary shadow-sm">
      <div class="card-header">
        <h1 class="h4 mb-0">Start Same Computer Game</h1>
      </div>

      <div class="card-body">
        <form method="post" class="row g-3">
          {% csrf_token %}

          <div class="col-md-6">
            <label class="form-label">White name</label>
            {{ form.white_name }}
          </div>

          <div class="col-md-6">
            <label class="form-label">Black name</label>
            {{ form.black_name }}
          </div>

          <div class="col-md-4">
            <label class="form-label">Initial minutes</label>
            {{ form.initial_minutes }}
          </div>

          <div class="col-md-4">
            <label class="form-label">Increment seconds</label>
            {{ form.increment_seconds }}
          </div>

          <div class="col-md-4">
            <label class="form-label">Delay seconds</label>
            {{ form.delay_seconds }}
          </div>

          <div class="col-12 d-flex gap-2">
            <button class="btn btn-success" type="submit">Start Game</button>
            <a class="btn btn-outline-light" href="{% url 'core:offline_mode' %}">
              Back
            </a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
