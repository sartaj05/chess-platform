{% extends "base.html" %}{% block title %}Matchmaking | {{ site_name }}{% endblock %}
{% block content %}<div class="auth-card text-center"><div class="profile-avatar mx-auto">♞</div><p class="eyebrow mt-3">RATED 10 MINUTE</p><h1>Find your opponent</h1><p class="text-dim">You are rated <strong>{{ request.user.rating }}</strong>. We search within 300 rating points.</p><button class="btn btn-success btn-lg w-100" id="matchButton">Start live matchmaking</button><button class="btn btn-outline-danger w-100 mt-2 d-none" id="cancelButton">Cancel search</button><div class="mt-4" id="matchStatus" aria-live="polite">Ready to search.</div></div>
<script>document.addEventListener('DOMContentLoaded',()=>{const endpoint="{% url 'api:rooms-api:matchmaking' %}",start=document.getElementById('matchButton'),cancel=document.getElementById('cancelButton'),status=document.getElementById('matchStatus'),csrf=document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1];let timer;const handle=data=>{if(data.matched&&data.room){clearInterval(timer);status.textContent='Match found! Opening lobby...';location.href='/play/'+data.room.code+'/';}else status.textContent='Searching live for an opponent...';};start.onclick=async()=>{start.classList.add('d-none');cancel.classList.remove('d-none');handle(await(await fetch(endpoint,{method:'POST',headers:{'X-CSRFToken':csrf}})).json());timer=setInterval(async()=>handle(await(await fetch(endpoint)).json()),2000);};cancel.onclick=async()=>{clearInterval(timer);await fetch(endpoint,{method:'DELETE',headers:{'X-CSRFToken':csrf}});location.reload();};});</script>{% endblock %}
