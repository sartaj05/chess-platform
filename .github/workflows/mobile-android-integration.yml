name: Android integration tests

on:
  pull_request:
    paths: ["mobile_app/**", ".github/workflows/mobile-android-integration.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: macos-14
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: mobile_app
          script: flutter test integration_test/app_test.dart -d emulator-5554

  physical-phone:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, android-phone]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4
      - run: flutter pub get
      - run: flutter devices
      - name: Verify a physical phone is attached
        run: |
          test "$(adb -s '${{ vars.ANDROID_DEVICE_ID }}' get-state)" = "device"
          test "$(adb -s '${{ vars.ANDROID_DEVICE_ID }}' shell getprop ro.kernel.qemu | tr -d '\r')" != "1"
      - run: flutter test integration_test/app_test.dart -d ${{ vars.ANDROID_DEVICE_ID }} --reporter expanded
