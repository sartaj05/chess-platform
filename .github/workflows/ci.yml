name: Django CI
on:
  push: {branches: ["main", "develop"]}
  pull_request: {branches: ["main", "develop"]}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: chess_platform_test, POSTGRES_USER: chess, POSTGRES_PASSWORD: chess_password}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chess -d chess_platform_test" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: chess_platform.settings.test
      DJANGO_SECRET_KEY: ci-secret
      DATABASE_URL: postgres://chess:chess_password@localhost:5432/chess_platform_test
      REDIS_URL: redis://localhost:6379/0
      CHANNEL_REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/2
      CELERY_RESULT_BACKEND: redis://localhost:6379/3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: "pip"}
      - run: python -m pip install --upgrade pip && pip install -r requirements/dev.txt
      - run: ./scripts/fetch_frontend_assets.sh
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest --cov=apps --cov=chess_platform
