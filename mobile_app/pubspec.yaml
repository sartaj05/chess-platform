name: chess_platform_mobile
description: Offline-first Android and Windows chess application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  chess: ^0.8.1
  flutter_secure_storage: ^9.2.4
  # These paired versions keep Android push support and use a Windows Firebase
  # C++ SDK compatible with the minimum Visual Studio version Flutter accepts.
  firebase_core: 3.12.1
  firebase_messaging: 15.2.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/app_icon.png
